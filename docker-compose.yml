services:
  web:
    build:
      context: .
      # Pass NEXT_PUBLIC_* into the build so Next inlines them into the client
      # bundle. Values interpolate from the file given to compose via --env-file
      # (deploy uses `--env-file .env.local`). `:-` keeps unset ones empty.
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
        NEXT_PUBLIC_CALCOM_URL: ${NEXT_PUBLIC_CALCOM_URL:-}
        NEXT_PUBLIC_GA_ID: ${NEXT_PUBLIC_GA_ID:-}
        NEXT_PUBLIC_GOOGLE_ADS_ID: ${NEXT_PUBLIC_GOOGLE_ADS_ID:-}
        NEXT_PUBLIC_ADS_LABEL_CONTACT: ${NEXT_PUBLIC_ADS_LABEL_CONTACT:-}
        NEXT_PUBLIC_ADS_LABEL_BOOKING: ${NEXT_PUBLIC_ADS_LABEL_BOOKING:-}
        NEXT_PUBLIC_ADS_LABEL_BOOKING_CONFIRMED: ${NEXT_PUBLIC_ADS_LABEL_BOOKING_CONFIRMED:-}
        NEXT_PUBLIC_ADS_LABEL_CALL: ${NEXT_PUBLIC_ADS_LABEL_CALL:-}
    container_name: poolman_web
    restart: unless-stopped
    ports:
      - "3004:3000"
    env_file:
      - .env.local
    networks:
      - hampton_net

networks:
  hampton_net:
    external: true
    name: hosthampton_hampton_net
