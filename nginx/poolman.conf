# poolman.benchworksai.com -> poolman_web:3000
# Add this block to host-hampton-ops/nginx/nginx.conf

server {
    listen 80;
    server_name poolman.benchworksai.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name poolman.benchworksai.com;

    # Reuse the *.benchworksai.com Cloudflare origin cert already on the box
    ssl_certificate     /etc/ssl/benchworksai/origin.pem;
    ssl_certificate_key /etc/ssl/benchworksai/origin-key.pem;

    resolver 127.0.0.11 valid=30s;
    set $upstream http://poolman_web:3000;

    location / {
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
